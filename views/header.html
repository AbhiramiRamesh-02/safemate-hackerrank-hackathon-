<header class="app-main-header">
    <div class="header-top-row">
        <div class="logo-container" onclick="showHome()" style="cursor:pointer;">
            <div class="logo-shield">
                <span class="logo-s">S</span>
            </div>
            <span class="logo-text">Safemate</span>
        </div>

        <div class="header-right">
            <a href="#" onclick="showAboutUs()" style="color:#DE638A;font-weight:600;font-size:13px;text-decoration:none;">About Us</a>
            <button class="logout-btn hidden" id="logoutBtn" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="header-search-box">
        <input type="text" id="headerDestinationSearch" placeholder="Search destination" onkeydown="if(event.key==='Enter') executeHeaderDestinationSearch()" style="border:none; background:transparent; font-size:13px; color:#271b35; outline:none; width:100%; font-family:inherit;">
        <button type="button" onclick="executeHeaderDestinationSearch()" style="background:#DE638A; color:white; border:none; border-radius:20px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:4px; transition:background 0.15s ease; white-space:nowrap;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <span>Search</span>
        </button>
    </div>
</header>
